name: Deploy GitHub Pages demo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Install linux rolldown binding
        run: |
          VER="$(node -p "require('./apps/web/node_modules/rolldown/package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu']")"
          npm install --no-save --no-package-lock "@rolldown/binding-linux-x64-gnu@${VER}"
      - name: Build demo
        run: npm run build:demo
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
